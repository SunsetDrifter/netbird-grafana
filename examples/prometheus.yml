# Vanilla Prometheus (agent mode) equivalent of the Alloy config.
# Use this if you're on Prometheus instead of Alloy.
#
# Run Prometheus in agent mode (no local TSDB, remote_write only):
#   prometheus --enable-feature=agent --config.file=prometheus.yml
#
# Set GC_PROM_URL, GC_PROM_USER, GC_PROM_TOKEN in the process environment.

global:
  scrape_interval: 60s
  external_labels:
    # All series get this label, so dashboards can filter by $instance consistently.
    # Replace with the public hostname or stable identifier for this NetBird deployment.
    instance: netbird.example.com

scrape_configs:
  - job_name: netbird-server
    static_configs:
      - targets: ["netbird-server:9090"]
    metric_relabel_configs:
      # NetBird emits empty otel_scope_* labels; drop them to save cardinality.
      - regex: "otel_scope_.*"
        action: labeldrop

  # Optional — omit if you don't run Traefik in front of NetBird.
  # Enable on Traefik with:
  #   --entrypoints.metrics.address=:8082
  #   --metrics.prometheus=true
  #   --metrics.prometheus.entrypoint=metrics
  #   --metrics.prometheus.addrouterslabels=true
  #   --metrics.prometheus.addserviceslabels=true
  - job_name: traefik
    static_configs:
      - targets: ["traefik:8082"]

  # Host metrics — run a node_exporter sidecar and point this at it.
  - job_name: integrations/unix
    static_configs:
      - targets: ["node-exporter:9100"]

remote_write:
  - url: ${GC_PROM_URL}
    basic_auth:
      username: ${GC_PROM_USER}
      password: ${GC_PROM_TOKEN}
